<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CSS Playground (works offline)</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: Arial, sans-serif; background: #10132b; color: #fff; display: flex; flex-direction: column; height: 100vh; }
  header { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; padding: 10px 14px; background: #1d2250; }
  header h1 { font-size: 1.1rem; margin: 0 10px 0 0; color: #ffc83d; }
  select, button { font: inherit; padding: 6px 10px; border-radius: 8px; border: 0; }
  button { background: #2965f1; color: #fff; cursor: pointer; }
  button.alt { background: #ff4f8b; }
  main { flex: 1; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 10px; min-height: 0; }
  .col { display: flex; flex-direction: column; gap: 8px; min-height: 0; }
  label { font-size: 0.8rem; color: #ffc83d; font-weight: bold; }
  textarea { flex: 1; width: 100%; background: #0a0c1f; color: #e5e7eb; border: 1px solid #3b4290; border-radius: 8px; padding: 10px; font: 13px/1.5 "Courier New", monospace; resize: none; tab-size: 2; }
  iframe { flex: 1; width: 100%; border: 0; border-radius: 8px; background: #fff; min-height: 0; }
  @media (max-width: 800px) { main { grid-template-columns: 1fr; overflow: auto; } textarea, iframe { min-height: 220px; } }
</style>
</head>
<body>
<header>
  <h1>CSS Playground</h1>
  <select id="pick" aria-label="Choose an example"></select>
  <button id="reset" class="alt">Reset to original</button>
  <button id="copy">Copy CSS</button>
  <span style="font-size:.8rem;color:#c7d2fe">Edits are not saved. Copy your CSS into style.css to keep it.</span>
</header>
<main>
  <div class="col"><label for="html">HTML (body content)</label><textarea id="html" spellcheck="false"></textarea><label for="css">CSS</label><textarea id="css" spellcheck="false"></textarea></div>
  <div class="col"><label>Result</label><iframe id="out" title="Result"></iframe></div>
</main>

 Activity: Activity: design a quote card","html":"\u003ch1>Quote of the Day\u003c/h1>\n\u003cblockquote>\n  Good design is as little design as possible.\n  \u003ccite>Dieter Rams\u003c/cite>\n\u003c/blockquote>","css":"/* Lesson 2 activity: quote card */\n\n:root {\n  /* --ink, --paper, --accent */\n}\n\nbody {\n  /* background, colour, font-family, padding */\n}\n\nh1 {\n  /* centre and letter-spacing */\n}\n\nblockquote {\n  /* font-size, line-height, border-left */\n}\n\ncite {\n  /* display, font-size, font-style, colour */\n}\n","cls":"","lesson":2},{"id":"l2_act_sol","title":"Lesson 2 - Activity solution","html":"\u003ch1>Quote of the Day\u003c/h1>\n\u003cblockquote>\n  Good design is as little design as possible.\n  \u003ccite>Dieter Rams\u003c/cite>\n\u003c/blockquote>","css":":root {\n  --ink: #1f2937;\n  --paper: #fff8e7;\n  --accent: #ff4f8b;\n}\nbody {\n  background: var(--paper);\n  color: var(--ink);\n  font-family: Georgia, serif;\n  padding: 24px;\n}\nh1 {\n  text-align: center;\n  letter-spacing: 2px;\n  font-size: 1.6rem;\n}\nblockquote {\n  font-size: 1.5rem;\n  line-height: 1.5;\n  border-left: 6px solid var(--accent);\n  padding-left: 16px;\n  margin-left: 0;\n}\ncite {\n  display: block;\n  margin-top: 8px;\n  font-size: 0.9rem;\n  font-style: normal;\n  color: var(--accent);\n}\n","cls":"","lesson":2},{"id":"l2_chal","title":"Lesson 2 - Challenge: Challenge: a light and dark theme","html":"\u003ch1>Study Planner\u003c/h1>\n\u003cp>Revision starts at \u003cspan class=\"tag\">6 pm\u003c/span> tonight.\u003c/p>\n\u003cp>Remember: short breaks beat long marathons.\u003c/p>","css":"/* Lesson 2 challenge: light and dark theme */\n\n:root {\n  /* light theme variables */\n}\n\nbody.dark {\n  /* override the same variables here */\n}\n\nbody {\n  /* use var() */\n  font-family: Arial, sans-serif;\n  padding: 24px;\n}\n\n.tag {\n  padding: 2px 10px;\n  border-radius: 20px;\n}\n","cls":"","lesson":2},{"id":"l2_chal_sol","title":"Lesson 2 - Challenge solution","html":"\u003ch1>Study Planner\u003c/h1>\n\u003cp>Revision starts at \u003cspan class=\"tag\">6 pm\u003c/span> tonight.\u003c/p>\n\u003cp>Remember: short breaks beat long marathons.\u003c/p>","css":":root {\n  --bg: #ffffff;\n  --text: #1f2937;\n  --accent: #2965f1;\n}\nbody.dark {\n  --bg: #10132b;\n  --text: #e5e7eb;\n  --accent: #ffc83d;\n}\nbody {\n  background: var(--bg);\n  color: var(--text);\n  font-family: Arial, sans-serif;\n  padding: 24px;\n}\nh1 {\n  color: var(--accent);\n}\n.tag {\n  background: var(--accent);\n  color: var(--bg);\n  padding: 2px 10px;\n  border-radius: 20px;\n}\n","cls":"dark","lesson":2},{"id":"l3_ex1","title":"Lesson 3 - Example 1: Padding, border and margin","html":"\u003cdiv class=\"card\">First card\u003c/div>\n\u003cdiv class=\"card\">Second card\u003c/div>","css":".card {\n  width: 240px;\n  padding: 20px;\n  border: 4px solid #2965f1;\n  margin: 24px;\n  background: #eef2ff;\n  font-family: Arial, sans-serif;\n}\n","cls":"","lesson":3},{"id":"l3_ex2","title":"Lesson 3 - Example 2: box-sizing: content-box vs border-box","html":"\u003cdiv class=\"box content-box\">content-box: 250px wide\u003c/div>\n\u003cdiv class=\"box border-box\">border-box: 200px wide\u003c/div>","css":".box {\n  width: 200px;\n  padding: 20px;\n  border: 5px solid #ff4f8b;\n  background: #fff1f6;\n  margin-bottom: 12px;\n  font-family: Arial, sans-serif;\n}\n.content-box { box-sizing: content-box; }\n.border-box { box-sizing: border-box; }\n","cls":"","lesson":3},{"id":"l3_ex3","title":"Lesson 3 - Example 3: Centring and inline-block","html":"\u003cdiv class=\"page\">\n  \u003ch2>Match day\u003c/h2>\n  \u003cp>Tickets: \u003cspan class=\"tag\">Sold out\u003c/span>\u003c/p>\n\u003c/div>","css":".page {\n  max-width: 420px;\n  margin: 0 auto;\n  padding: 16px;\n  border: 2px solid #2965f1;\n  font-family: Arial;\n}\n.tag {\n  display: inline-block;\n  padding: 4px 12px;\n  background: gold;\n}\n","cls":"","lesson":3},{"id":"l3_act","title":"Lesson 3 ; }\n}\n@media (prefers-reduced-motion: reduce) {\n  .spinner { animation-duration: 3s; }\n}\n","cls":"","lesson":7},{"id":"l7_act","title":"Lesson 7 - Activity: Activity: animated landing hero","html":"\u003csection class=\"hero\">\n  \u003ch1>Learn CSS\u003c/h1>\n  \u003cp>Make the web look amazing.\u003c/p>\n  \u003ca class=\"cta\" href=\"#\">Start now\u003c/a>\n\u003c/section>","css":"/* Lesson 7 activity: animated hero */\n\nbody {\n  margin: 0;\n  font-family: Arial, sans-serif;\n}\n\n.hero {\n  text-align: center;\n  padding: 50px 20px;\n  background: linear-gradient(135deg, #2965f1, #8b5cf6);\n  color: white;\n}\n\n.cta {\n  display: inline-block;\n  background: #ffc83d;\n  color: #10132b;\n  padding: 12px 26px;\n  border-radius: 30px;\n  text-decoration: none;\n  font-weight: bold;\n}\n\n/* 1. @keyframes rise */\n\n/* 2-3. animation and delays */\n\n/* 4. hover transition */\n\n/* 5. prefers-reduced-motion */\n","cls":"","lesson":7},{"id":"l7_act_sol","title":"Lesson 7 - Activity solution","html":"\u003csection class=\"hero\">\n  \u003ch1>Learn CSS\u003c/h1>\n  \u003cp>Make the web look amazing.\u003c/p>\n  \u003ca class=\"cta\" href=\"#\">Start now\u003c/a>\n\u003c/section>","css":"body {\n  margin: 0;\n  font-family: Arial, sans-serif;\n}\n.hero {\n  text-align: center;\n  padding: 50px 20px;\n  background: linear-gradient(135deg, #2965f1, #8b5cf6);\n  color: white;\n}\n.cta {\n  display: inline-block;\n  background: #ffc83d;\n  color: #10132b;\n  padding: 12px 26px;\n  border-radius: 30px;\n  text-decoration: none;\n  font-weight: bold;\n  transition: transform 0.3s ease;\n}\n.cta:hover {\n  transform: scale(1.06);\n}\n@keyframes rise {\n  from {\n    opacity: 0;\n    transform: translateY(20px);\n  }\n  to {\n    opacity: 1;\n    transform: translateY(0);\n  }\n}\n@media (prefers-reduced-motion: no-preference) {\n  .hero h1, .hero p, .cta {\n    animation: rise 0.8s ease both;\n  }\n  .hero p { animation-delay: 0.2s; }\n  .cta { animation-delay: 0.4s; } function run() {
  const cls = current && current.cls ? ' class="' + current.cls + '"' : "";
  out.srcdoc = '<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><style>' + css.value.replace(/<\/style/gi, "") + '</style></head><body' + cls + '>' + html.value + '</body></html>';
}
function load(i) { current = ITEMS[i]; html.value = current.html; css.value = current.css; run(); }
let t; [html, css].forEach((el) => el.addEventListener("input", () => { clearTimeout(t); t = setTimeout(run, 250); }));
pick.addEventListener("change", () => load(+pick.value));
document.getElementById("reset").addEventListener("click", () => load(+pick.value));
document.getElementById("copy").addEventListener("click", () => { css.select(); try { document.execCommand("copy"); } catch (e) {} });
[html, css].forEach((el) => el.addEventListener("keydown", (e) => { if (e.key === "Tab") { e.preventDefault(); const s = el.selectionStart; el.setRangeText("  ", s, el.selectionEnd, "end"); el.dispatchEvent(new Event("input")); } }));
load(0);
</script>
</body>
</html>
